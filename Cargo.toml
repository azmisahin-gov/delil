[workspace]
resolver = "2"
members = [
    "crates/delil-core",
    "crates/delil-hash",
    "crates/delil-case-store",
    "crates/delil-evidence",
    "crates/delil-audio",
    "crates/delil-assignment",
    "crates/delil-transcription",
    "crates/delil-quality",
    "crates/delil-report",
    "crates/delil-udf",
    "crates/delil-export",
    "crates/delil-update",
    "crates/delil-pipeline",
    "crates/delil-cli",
    "crates/delil-app",
    "crates/delil-integration-tests",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
delil-core = { path = "crates/delil-core" }
delil-hash = { path = "crates/delil-hash" }
delil-case-store = { path = "crates/delil-case-store" }
delil-evidence = { path = "crates/delil-evidence" }
delil-audio = { path = "crates/delil-audio" }
delil-assignment = { path = "crates/delil-assignment" }
delil-transcription = { path = "crates/delil-transcription" }
delil-quality = { path = "crates/delil-quality" }
delil-report = { path = "crates/delil-report" }
delil-udf = { path = "crates/delil-udf" }
delil-export = { path = "crates/delil-export" }
delil-update = { path = "crates/delil-update" }
delil-pipeline = { path = "crates/delil-pipeline" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = { version = "0.36", features = ["serialize"] }
base64 = "0.22"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
walkdir = "2"
tempfile = "3"
