[package]
name = "delil-transcription"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Yerel Whisper transkripsiyon motoru ve kuyruk"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
delil-core = { workspace = true }
delil-audio = { workspace = true }

[dependencies.candle]
package = "candle-core"
version = "0.8"
optional = true
[dependencies.candle-nn]
version = "0.8"
optional = true
[dependencies.candle-transformers]
version = "0.8"
optional = true
[dependencies.tokenizers]
version = "0.21"
optional = true

[features]
default = []
candle = ["dep:candle", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers"]
decode = ["delil-audio/decode"]
full = ["candle", "decode"]

[dev-dependencies]
tempfile = { workspace = true }
